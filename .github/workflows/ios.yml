name: iOS

# Builds River for iOS: the simulator app (started in an iPhone simulator,
# where the client core must come up and open its encrypted storage) and an
# unsigned device app packaged as an .ipa for sideloading. Release builds are
# made by release.yml with the same steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and run on a simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the newest Xcode (libsignal's Swift needs Swift 6.2)
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - run: npm ci
      - name: Build the UI and the client core, sync the iOS project (pod install)
        run: npm run sync:ios -w @river/mobile
      - name: Build for the simulator
        working-directory: apps/mobile/ios/App
        run: |
          status=0
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > xcodebuild-sim.log 2>&1 || status=$?
          grep -E 'error:|Undefined symbol|ld: |BUILD' xcodebuild-sim.log | head -60 || true
          if [ "$status" != 0 ]; then grep -B5 -A40 'Undefined symbols' xcodebuild-sim.log | head -120 || true; exit "$status"; fi
          test -f build/Build/Products/Debug-iphonesimulator/App.app/Info.plist
      - name: Start River in a simulator
        working-directory: apps/mobile/ios/App
        run: |
          device=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices;const all=Object.entries(d).filter(([k])=>k.includes('iOS')).flatMap(([,v])=>v);const p=all.find(x=>/^iPhone/.test(x.name));console.log(p.udid)")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/App.app
          # NSLog goes to the app's stderr: stream it to a file while River runs.
          (xcrun simctl launch --console-pty --terminate-running-process "$device" io.github.martexdev.river -RiverSelfTest > river.log 2>&1 &)
          for i in $(seq 1 60); do
            if grep -q "self-test storage" river.log 2>/dev/null; then break; fi
            sleep 5
          done
          cat river.log | grep -a "\[River\]\|error\|Error\|fatal" | head -100 || true
          if ! grep -aq "self-test storage" river.log; then
            echo "---- app log (last 150 lines)"
            xcrun simctl spawn "$device" log show --last 10m --predicate 'process == "App"' --style compact | tail -150 || true
            echo "---- crash reports"
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -10 || true
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/App* 2>/dev/null | head -1); do head -120 "$f"; done
            exit 1
          fi
          grep -aq "client core ready" river.log
          grep -a "self-test storage" river.log | grep -q '"state":"open"'
          grep -a "self-test storage" river.log | grep -q '"protection":"os-keystore"'
      - name: Build the device app (unsigned) and package it
        working-directory: apps/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | grep -E 'error:|Undefined symbol|ld: |BUILD' || true
          test -f build/Build/Products/Release-iphoneos/App.app/Info.plist
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry River-ios-unsigned.ipa Payload
          ls -la River-ios-unsigned.ipa
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-logs
          path: apps/mobile/ios/App/xcodebuild-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: river-ios-unsigned
          path: apps/mobile/ios/App/River-ios-unsigned.ipa
          retention-days: 7
