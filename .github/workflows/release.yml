name: Release

# Pushing a tag vX.Y.Z (stable), vX.Y.Z-beta.N (beta) or vX.Y.Z-alpha.N (nightly)
# builds, signs and publishes a GitHub Release that installed clients update from.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag must match package versions
        run: node scripts/release/set-version.ts --check "$GITHUB_REF_NAME"
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Changelog entry must exist
        run: node scripts/release/changelog-section.ts "${{ steps.version.outputs.version }}" > /dev/null
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: --win }
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - name: Package installers
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Free code signing for open source (SignPath Foundation). Off until the project is
      # accepted and SIGNPATH_ORGANIZATION_ID (variable) and SIGNPATH_API_TOKEN (secret) exist;
      # each release waits here until the maintainer approves the request in SignPath.
      - name: Unsigned Windows installer for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-installer
          path: apps/desktop/release/River-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the Windows installer (SignPath Foundation)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'river' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-installer
      - name: Use the signed installer
        if: steps.unsigned.outcome == 'success'
        run: node scripts/release/use-signed-installer.ts signed-installer apps/desktop/release
      - name: Installer signature is valid
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature (Get-Item apps/desktop/release/River-Setup-*.exe)
          "$($s.Status): $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw 'The installer is not validly signed.' }
      - name: Allow Chromium sandbox on Ubuntu runners
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Packaged app starts (self-test, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/release/self-test-packaged.ts
      - name: Packaged app starts (self-test)
        if: runner.os != 'Linux'
        run: node scripts/release/self-test-packaged.ts
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload
          cd apps/desktop/release
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.rpm *.blockmap latest*.yml; do
            [ -f "$f" ] && cp "$f" ../../../upload/
          done
          ls -la ../../../upload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.key.outputs.preview }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Release signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.RIVER_ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/river-android.p12"
            echo "preview=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No permanent key yet (scripts/release/create-android-key.py): sign this build with a
          # one-off key, so the APK installs. Moving to the permanent key later needs one reinstall.
          echo "::warning::No Android signing key yet: the APKs are signed with a one-off preview key."
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$RUNNER_TEMP/river-android.p12" -storetype PKCS12 -storepass "$pw" -keypass "$pw" -alias river -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=River preview, O=martex-dev" > /dev/null
          echo "RIVER_PREVIEW_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "preview=true" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Build the UI and the client core, sync the Android project
        run: npm run sync -w @river/mobile
      - name: Build signed release APKs
        working-directory: apps/mobile/android
        env:
          RIVER_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/river-android.p12
          PERMANENT_PASSWORD: ${{ secrets.RIVER_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export RIVER_ANDROID_KEYSTORE_PASSWORD="${RIVER_PREVIEW_PASSWORD:-$PERMANENT_PASSWORD}"
          export RIVER_ANDROID_KEY_PASSWORD="$RIVER_ANDROID_KEYSTORE_PASSWORD"
          export RIVER_ANDROID_KEY_ALIAS=river
          RIVER_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME") ./gradlew --no-daemon assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p upload
          out=apps/mobile/android/app/build/outputs/apk/release
          cp "$out/app-arm64-v8a-release.apk" "upload/River-$VERSION-android-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "upload/River-$VERSION-android-arm32.apk"
          cp "$out/app-x86_64-release.apk" "upload/River-$VERSION-android-x86_64.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "upload/River-$VERSION-android-arm64.apk" | head -3
          rm -f "$RUNNER_TEMP/river-android.p12"
          ls -la upload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-Android
          path: upload/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: [verify, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Software bill of materials (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file dist/river-sbom.cdx.json
      - name: Version-less download names
        # Stable links for the invite page and the README: …/releases/latest/download/River-Setup.exe
        # always gets the newest installer. Updates keep using the versioned files in latest*.yml.
        run: |
          cd dist
          copy() { [ -f "$1" ] && cp "$1" "$2" || echo "missing $1"; }
          copy "River-Setup-$VERSION.exe" River-Setup.exe
          copy "River-$VERSION-arm64.dmg" River-mac-apple-silicon.dmg
          copy "River-$VERSION-x64.dmg" River-mac-intel.dmg
          copy "River-$VERSION-x86_64.AppImage" River-linux.AppImage
          copy "River-$VERSION-amd64.deb" River-linux.deb
          copy "River-$VERSION-x86_64.rpm" River-linux.rpm
          if [ -f "River-$VERSION-android-arm64.apk" ]; then cp "River-$VERSION-android-arm64.apk" River-android.apk; fi
      - name: Sign release manifest
        env:
          RIVER_RELEASE_SIGNING_KEY: ${{ secrets.RIVER_RELEASE_SIGNING_KEY }}
        run: node scripts/release/sign-manifest.ts dist "$VERSION" "$GITHUB_SHA"
      - name: Release notes
        run: |
          node scripts/release/changelog-section.ts "$VERSION" > notes.md
          if [ "${{ needs.android.outputs.preview }}" = "true" ]; then
            {
              echo
              echo "> **Android:** these APKs are a preview, signed with a one-off key. The first build signed with River's permanent key will ask you to uninstall the preview first (River on the phone starts fresh once)."
            } >> notes.md
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "River $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
