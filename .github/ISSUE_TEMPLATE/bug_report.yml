name: Bug report
description: Something in River does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** please do not file them here — use [private vulnerability reporting](https://github.com/martex-dev/river/security/advisories/new).
        Never paste message content, keys or personal data into issues.
  - type: input
    id: version
    attributes:
      label: River version
      description: Settings → About
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, iOS, Android]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
