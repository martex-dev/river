apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// River's version comes from apps/mobile/package.json (set for every release by
// scripts/release/set-version.ts): 1.2.3 → versionName "1.2.3", versionCode 1002003.
def riverVersion = new JsonSlurper().parse(file('../../package.json')).version as String
def (major, minor, patch) = riverVersion.tokenize('.-')[0..2].collect { it as int }

// Release signing: the key lives only in CI secrets and the maintainer's offline backup.
def keystoreFile = System.getenv('RIVER_ANDROID_KEYSTORE_FILE')

android {
    namespace = "io.github.martexdev.river"
    compileSdk = rootProject.ext.compileSdkVersion
    // With an NDK, native libraries are stripped of debug symbols (CI passes the installed version).
    if (System.getenv('RIVER_NDK_VERSION')) ndkVersion = System.getenv('RIVER_NDK_VERSION')
    defaultConfig {
        applicationId "io.github.martexdev.river"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 1000000 + minor * 1000 + patch
        versionName riverVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // libsignal uses java.time and newer collections APIs.
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('RIVER_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RIVER_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('RIVER_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreFile) signingConfig signingConfigs.release
        }
    }
    // One APK per processor type keeps downloads small (libsignal is native code).
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
    packaging {
        resources {
            // libsignal-client's desktop libraries (macOS, Linux, Windows): never needed on a phone.
            excludes += ['*.dylib', '*.dll', 'libsignal_jni_amd64.so', 'libsignal_jni_testing_amd64.so']
        }
        jniLibs {
            // Compressed inside the APK: a much smaller download (Android unpacks them on install).
            useLegacyPackaging = true
            // libsignal's test-only library: never used by the app.
            excludes += ['**/libsignal_jni_testing.so']
        }
    }
}

// Distinct version codes per processor type, so Android installs the right one.
android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def offsets = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86_64': 3]
        if (abi != null) output.versionCodeOverride = variant.versionCode * 10 + offsets[abi]
    }
}

repositories {
    // libsignal for Android is published by Signal on its own Maven repository.
    maven {
        url 'https://build-artifacts.signal.org/libraries/maven/'
        content { includeGroup 'org.signal' }
    }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation 'androidx.biometric:biometric:1.1.0'
    // Same libsignal version as the desktop (apps/desktop/package.json).
    implementation 'org.signal:libsignal-android:0.105.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'net.zetetic:sqlcipher-android:4.19.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
